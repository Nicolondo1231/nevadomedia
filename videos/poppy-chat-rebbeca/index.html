<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #12101F; }
      #root {
        width: 100%; height: 100%; position: relative; overflow: hidden;
        background: #12101F;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }

      /* the chat panel */
      #panel {
        position: absolute; left: 5%; right: 5%; top: 11%; bottom: 11%;
        background: #F7F6FD; border: 8px solid #12101F; box-shadow: 22px 22px 0 #7F78EB;
        display: flex; flex-direction: column; overflow: hidden;
      }

      /* header */
      #head {
        background: #7F78EB; border-bottom: 8px solid #12101F;
        padding: 34px 36px; display: flex; align-items: center; gap: 26px; flex: none;
      }
      #avatar {
        width: 104px; height: 104px; border-radius: 50%; background: #F4938F;
        border: 6px solid #12101F; display: flex; align-items: center; justify-content: center;
        font-size: 46px; font-weight: 900; color: #12101F; flex: none;
      }
      #who { flex: 1; }
      #name { font-size: 46px; font-weight: 900; color: #12101F; letter-spacing: -0.01em; }
      #status { font-size: 28px; font-weight: 700; color: #12101F; opacity: 0.66; margin-top: 6px; }
      #dot { width: 22px; height: 22px; border-radius: 50%; background: #12101F; flex: none; }

      /* thread */
      #thread { flex: 1; padding: 40px 36px; display: flex; flex-direction: column; gap: 30px; }

      .row { display: flex; }
      .row.out { justify-content: flex-end; }
      .row.in { justify-content: flex-start; }

      .bubble {
        max-width: 84%; border: 6px solid #12101F; padding: 30px 32px;
        font-size: 40px; line-height: 1.34; font-weight: 600;
      }
      .bubble.out { background: #7F78EB; color: #F7F6FD; box-shadow: 12px 12px 0 #8781EC; }
      .bubble.in  { background: #F4938F; color: #12101F; box-shadow: 12px 12px 0 #12101F;
                    font-size: 58px; font-weight: 900; padding: 26px 46px; }

      #typing {
        display: flex; align-items: center; gap: 16px;
        background: #EDEBF9; border: 6px solid #12101F; padding: 30px 36px;
      }
      #typing i { width: 22px; height: 22px; border-radius: 50%; background: #12101F; display: block; }

      /* composer */
      #composer {
        flex: none; border-top: 8px solid #12101F; background: #EDEBF9;
        padding: 28px 30px; display: flex; align-items: flex-end; gap: 22px;
      }
      #inputbox {
        flex: 1; min-height: 104px; background: #F7F6FD; border: 6px solid #12101F;
        padding: 22px 26px; font-size: 36px; line-height: 1.3; font-weight: 600; color: #12101F;
      }
      #caret { display: inline-block; width: 5px; height: 40px; background: #F4938F;
               vertical-align: -6px; margin-left: 3px; }
      #send {
        width: 104px; height: 104px; flex: none; background: #F4938F; border: 6px solid #12101F;
        display: flex; align-items: center; justify-content: center;
      }
      #send svg { width: 48px; height: 48px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="12"
      data-width="1080"
      data-height="1920"
    >
      <div id="panel">
        <div id="head">
          <div id="avatar">R</div>
          <div id="who">
            <div id="name">Rebbeca</div>
            <div id="status">online now</div>
          </div>
          <div id="dot"></div>
        </div>

        <div id="thread">
          <div class="row out" id="rowout"><div class="bubble out" id="bubbleout"></div></div>
          <div class="row in" id="rowtyping"><div id="typing"><i></i><i></i><i></i></div></div>
          <div class="row in" id="rowin"><div class="bubble in" id="bubblein">Yes</div></div>
        </div>

        <div id="composer">
          <div id="inputbox"><span id="draft"></span><span id="caret"></span></div>
          <div id="send">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 21l21-9L2 3v7l15 2-15 2v7z" fill="#12101F"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const MSG =
          "rebbeca i saw you wanted to book a call, and your reason for actually joining is because you want to build a facebook ads system that can get you 3 to 5 clients recurrent";

        // Split the draft into per-character spans so the type-on is deterministic.
        const draft = document.getElementById("draft");
        const chars = [];
        for (const ch of MSG) {
          const s = document.createElement("span");
          s.textContent = ch;
          draft.appendChild(s);
          chars.push(s);
        }
        document.getElementById("bubbleout").textContent = MSG;

        const TYPE_START = 0.75;
        const TYPE_STEP = 0.0235;
        const TYPE_END = TYPE_START + chars.length * TYPE_STEP; // ~4.8s
        const SEND = TYPE_END + 0.25;
        const DOTS = SEND + 0.75;
        const REPLY = DOTS + 1.65;

        const tl = gsap.timeline({ paused: true });

        // 1 — the chat panel arrives
        tl.fromTo("#panel", { opacity: 0, y: 70, scale: 0.94 },
                            { opacity: 1, y: 0, scale: 1, duration: 0.75, ease: "power3.out" }, 0);
        tl.fromTo("#avatar", { opacity: 0, scale: 0.6 },
                             { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out" }, 0.3);
        tl.fromTo(["#name", "#status", "#dot"], { opacity: 0, x: -26 },
                  { opacity: 1, x: 0, duration: 0.4, stagger: 0.07, ease: "power3.out" }, 0.4);

        // everything in the thread starts empty
        tl.set(["#rowout", "#rowtyping", "#rowin"], { opacity: 0 }, 0);
        tl.set(chars, { opacity: 0 }, 0);

        // 2 — the message types into the composer
        tl.fromTo("#caret", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, TYPE_START - 0.1);
        tl.to(chars, { opacity: 1, duration: 0.01, stagger: TYPE_STEP, ease: "none" }, TYPE_START);

        // 3 — send: the draft leaves the composer and lands as a bubble
        tl.to("#caret", { opacity: 0, duration: 0.01, ease: "none" }, SEND - 0.05);
        tl.to("#send", { scale: 0.86, duration: 0.12, ease: "power2.out" }, SEND - 0.12);
        tl.to("#send", { scale: 1, duration: 0.3, ease: "power3.out" }, SEND);
        tl.to("#inputbox", { opacity: 0.35, duration: 0.18, ease: "power2.out" }, SEND);
        tl.to(chars, { opacity: 0, duration: 0.14, ease: "power2.in" }, SEND);
        tl.to("#inputbox", { opacity: 1, duration: 0.2, ease: "power2.out" }, SEND + 0.2);

        tl.fromTo("#rowout", { opacity: 0, y: 90, scale: 0.9 },
                             { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, SEND + 0.02);

        // 4 — Rebbeca is typing
        tl.fromTo("#rowtyping", { opacity: 0, y: 40, scale: 0.9 },
                                { opacity: 1, y: 0, scale: 1, duration: 0.38, ease: "power3.out" }, DOTS);
        const dots = document.querySelectorAll("#typing i");
        // three finite pulses — deterministic, no repeat/yoyo
        for (let p = 0; p < 3; p++) {
          const at = DOTS + 0.3 + p * 0.42;
          tl.to(dots, { y: -14, duration: 0.16, stagger: 0.09, ease: "power2.out" }, at);
          tl.to(dots, { y: 0, duration: 0.2, stagger: 0.09, ease: "power2.in" }, at + 0.16);
        }
        tl.to("#rowtyping", { opacity: 0, scale: 0.9, duration: 0.2, ease: "power2.in" }, REPLY - 0.18);
        tl.set("#rowtyping", { height: 0, margin: 0 }, REPLY - 0.02);

        // 5 — the reply lands
        tl.fromTo("#rowin", { opacity: 0, y: 60, scale: 0.7 },
                            { opacity: 1, y: 0, scale: 1, duration: 0.42, ease: "expo.out" }, REPLY);
        tl.to("#bubblein", { scale: 1.06, duration: 0.18, ease: "power2.out" }, REPLY + 0.42);
        tl.to("#bubblein", { scale: 1, duration: 0.34, ease: "power3.out" }, REPLY + 0.6);

        window.__timelines["main"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
